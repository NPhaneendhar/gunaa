<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guna Sri | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar reveal">
      <div class="logo">Guna Sri</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="home.html">Vision</a>
        <a href="about.html">About</a>
        <a class="active" href="contact.html">Contact</a>
      </nav>
    </header>

    <section class="glass form-shell reveal delay-1">
      <span class="kicker">Direct Channel</span>
      <h1>Let us build something exceptional.</h1>
      <p class="lead">Share your details and message. I will connect with you as soon as possible.</p>

      <form class="form-grid">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your full name">
        </div>
        <div>
          <label for="reg">Registration Number</label>
          <input id="reg" name="reg" type="text" placeholder="Your registration number">
        </div>
        <div>
          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" type="tel" placeholder="Your phone number">
        </div>
        <div>
          <label for="place">Place</label>
          <input id="place" name="place" type="text" placeholder="Your city or location">
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell me what you want to discuss"></textarea>
        </div>
        <button class="submit" type="submit">Send Message</button>
      </form>
    </section>

    <footer class="footer">Contact page: ready for real opportunities.</footer>
  </main>
</body>
</html>
